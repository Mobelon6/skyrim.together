name: Packaged dialogue interface
on:
  workflow_call:
    inputs:
      run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows build run for the MO2 package
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Locate packaged build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDED_RUN: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          run_id="$PROVIDED_RUN"
          if [[ -z "$run_id" ]]; then
            run_id="$(gh run list --workflow build.yml --branch "$GITHUB_REF_NAME" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Windows package from run $run_id"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.build.outputs.run_id }}
          pattern: 'Skyrim-Coop-*-MO2'
          path: package
          merge-multiple: true
      - name: Extract the interface from the MO2 installer
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive, = Path('package').glob('*.zip')
          with ZipFile(archive) as installer:
              for path in installer.namelist():
                  if path.startswith('SkyrimTogetherReborn/UI/'):
                      installer.extract(path, 'installer')
          PY
      - name: Check displayed subtitles, direction and leader actions
        run: |
          python -m pip install playwright==1.55.0
          python tools/check_dialogue_ui.py installer/SkyrimTogetherReborn/UI --chromium "$(command -v google-chrome)"
          python tools/verify_travel_settings.py installer/SkyrimTogetherReborn/UI "$(command -v google-chrome)"
          python tests/check_party_windows.py installer/SkyrimTogetherReborn/UI
