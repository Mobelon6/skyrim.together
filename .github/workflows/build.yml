name: Skyrim SE 1.6.1170 co-op
on:
  push:
    paths:
      - "required/**"
      - "important/**"
      - "src/**"
      - "reusable/tests/**"
      - "reusable/tools/**"
      - "obsolete/**"
      - .github/workflows/build.yml
      - GPL-3.0.txt
      - TiltedEvolution-LICENSE.txt
      - .github/workflows/dialogue-ui-test.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tiltedphoques/TiltedEvolution
          ref: 13ff0b5a934bf3016c8c898d9a019aa04e5c1fb0
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tiltedphoques/TiltedConnect
          ref: e6f5759364a64462e717db1153781a7eae26a13e
          path: connect-upstream
          persist-credentials: false
      - name: Load STM sources
        run: |
          cp -R src/Code upstream/
          cp -R src/Libraries/TiltedConnect/. connect-upstream/
      - name: Run all independent source and model checks
        shell: bash
        run: |
          failed=0
          run_check() {
            echo "::group::$*"
            if "$@"; then
              echo "PASS: $*"
            else
              echo "::error::Failed: $*"
              failed=1
            fi
            echo "::endgroup::"
          }
          run_check python3 required/tests/check_connection_lifecycle.py connect-upstream upstream
          run_check python3 required/tests/check_world_epoch.py upstream
          run_check python3 required/tests/check_save_load_lifecycle.py upstream
          run_check python3 required/tests/check_inventory_evidence.py upstream
          run_check python3 required/tests/check_encounter_combat.py upstream
          run_check python3 obsolete/tests/check_home_routes.py upstream
          run_check python3 obsolete/tests/check_home_registry.py upstream
          run_check python3 reusable/tests/check_home_scope.py upstream
          run_check python3 required/tests/check_home_spatial_epoch.py upstream
          run_check python3 reusable/tests/check_home_snapshot.py upstream
          run_check python3 obsolete/tests/check_home_projection.py upstream
          run_check python3 reusable/tests/check_home_catalog.py upstream
          run_check python3 important/tests/check_home_inventory_ledger.py upstream
          run_check python3 important/tests/check_home_container_menu.py upstream
          run_check python3 obsolete/tests/check_home_visit.py upstream
          run_check python3 important/tests/check_home_locks.py upstream
          run_check python3 reusable/tests/check_home_residents.py upstream
          run_check python3 reusable/tests/check_home_actor_protection.py upstream
          run_check python3 obsolete/tests/check_home_resident_projection.py upstream
          run_check python3 important/tests/check_home_loose_property.py upstream
          run_check python3 important/tests/check_home_objects.py upstream
          run_check python3 important/tests/check_home_placement.py upstream
          run_check python3 obsolete/tests/check_guest_packaging.py
          run_check python3 obsolete/tests/check_home_instances_generation.py
          run_check python3 obsolete/tests/check_home_navmesh.py
          run_check python3 important/tests/check_encounter_recovery.py upstream
          run_check python3 important/tests/check_trade.py upstream
          run_check python3 important/tests/check_native_trade.py upstream
          run_check python3 required/tests/check_actor_replay.py upstream
          run_check python3 important/tests/check_progress_consent.py upstream
          run_check python3 important/tests/check_party_travel.py upstream
          run_check python3 important/tests/check_interaction_owner.py upstream
          run_check python3 important/tests/check_follower_dialogue.py upstream
          run_check python3 important/tests/check_coop_interaction.py upstream
          run_check python3 required/tests/check_quest_journal.py upstream
          run_check python3 required/tests/check_campaign_journal.py upstream
          run_check python3 required/tests/check_campaign_replication.py upstream
          run_check python3 required/tests/check_campaign_identity.py upstream
          run_check python3 required/tests/check_campaign_checkpoint.py upstream
          run_check python3 reusable/tests/check_home_native_state.py upstream
          run_check python3 obsolete/tests/check_home_original_overlay.py upstream
          run_check python3 obsolete/tests/check_home_original_visit.py upstream
          run_check python3 obsolete/tests/check_home_guest_save.py upstream
          run_check python3 reusable/tests/check_home_native_capabilities.py upstream
          run_check python3 important/tests/check_home_seat_leases.py upstream
          run_check python3 obsolete/tests/check_home_native_residents.py upstream
          run_check python3 obsolete/tests/check_home_linked_rooms.py upstream
          run_check python3 reusable/tests/check_estate_catalog.py
          run_check python3 important/tests/check_home_linked_access.py upstream
          run_check python3 required/tests/check_life_confirmation.py upstream
          run_check python3 important/tests/check_observer.py upstream
          run_check python3 required/tests/check_replica_and_input.py upstream
          run_check python3 important/tests/check_dialogue_draw.py upstream
          run_check python3 required/tests/check_remote_hit.py upstream
          run_check python3 required/tests/check.py upstream
          run_check python3 required/tests/check_state3.py upstream
          run_check python3 required/tests/check_dialogue2.py upstream
          exit "$failed"

  build:
    needs: check
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
        working-directory: upstream
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tiltedphoques/TiltedEvolution
          ref: 13ff0b5a934bf3016c8c898d9a019aa04e5c1fb0
          submodules: recursive
          fetch-depth: 0
          path: upstream
          persist-credentials: false
      - name: Load STM sources
        run: cp -R ../src/. .
      - name: Cache compiled xmake packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake/packages
          key: str-deps-windows2022-x64-release-13ff0b5a-xmake310
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.0'
      - run: xmake config --plat=windows --arch=x64 --mode=release --skyrim_version=1.6.1170 --yes
      - run: xmake -y
      - name: Run TPTests with case diagnostics
        timeout-minutes: 5
        run: xmake run TPTests -d yes -s
      - name: Prepare runtime
        run: |
          set -eu
          xmake install -o distrib
          cp -R distrib/bin/. build/windows/x64/release/
          build/windows/x64/release/SkyrimTogetherServer.exe --generate-config ../ci-STServer.ini
          test -s ../ci-STServer.ini
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: upstream/Code/skyrim_ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Build user interface
        working-directory: upstream/Code/skyrim_ui
        run: |
          pnpm install --frozen-lockfile
          pnpm deploy:production
      - name: Assemble complete MO2 mod
        run: |
          set -eu
          mkdir -p ../mo2/SkyrimTogetherReborn
          cp -R GameFiles/Skyrim/. ../mo2/
          python ../required/tools/build_trade_plugin.py ../mo2/SkyrimCoopTrade.esp
          test -s ../mo2/SkyrimCoopTrade.esp
          cp ../GPL-3.0.txt ../TiltedEvolution-LICENSE.txt ../mo2/
          cp -R build/windows/x64/release/. ../mo2/SkyrimTogetherReborn/
          cp -R Code/skyrim_ui/dist/UI ../mo2/SkyrimTogetherReborn/
          cd ../mo2/SkyrimTogetherReborn
          rm -f *.pdb *.lib *.exp *Tests.exe
          test -s SkyrimTogether.exe
          test -s STServer.dll
          test -s SkyrimTogetherServer.exe
          test -s TPProcess.exe
          test -s UI/index.html
          test -s ../SkyrimTogether.esp
          cp SkyrimTogether.exe SkyrimSE.exe
          cd ..
          7z a -tzip ../Skyrim-Coop-SE-1170-Interaction07-dev-MO2.zip .
          7z t ../Skyrim-Coop-SE-1170-Interaction07-dev-MO2.zip
      - name: Test interface from the assembled installer
        working-directory: .
        run: |
          set -eu
          7z x Skyrim-Coop-SE-1170-Interaction07-dev-MO2.zip 'SkyrimTogetherReborn/UI/*' -opackage-test
          python -m pip install playwright==1.55.0
          python -m playwright install chromium
          ui=package-test/SkyrimTogetherReborn/UI
          python important/tests/check_dialogue_ui.py "$ui"
          python important/tests/verify_travel_settings.py "$ui"
          python important/tests/check_party_windows.py "$ui"
      - uses: actions/upload-artifact@v4
        with:
          name: Skyrim-Coop-SE-1170-Interaction07-dev-MO2
          path: Skyrim-Coop-SE-1170-Interaction07-dev-MO2.zip
          if-no-files-found: error
