name: Skyrim SE 1.6.1170 co-op
on:
  push:
    paths:
      - "*.patch"
      - .github/workflows/build.yml
      - check*.py
      - tools/check*.py
      - tools/build*.py
      - tools/package_guest_homes.py
      - tests/**
      - GPL-3.0.txt
      - TiltedEvolution-LICENSE.txt
      - .github/workflows/dialogue-ui-test.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tiltedphoques/TiltedEvolution
          ref: 13ff0b5a934bf3016c8c898d9a019aa04e5c1fb0
          path: upstream
          persist-credentials: false
      - run: git -C upstream apply ../CoopState.patch
      - run: git -C upstream apply ../PartyLeadership.patch
      - run: git -C upstream apply ../PartyConversationHud.patch
      - run: git -C upstream apply ../Dialogue02.patch
      - run: git -C upstream apply ../PartyTravelAndRecovery.patch
      - run: git -C upstream apply ../Interaction02.patch
      - run: git -C upstream apply ../Interaction03.patch
      - run: git -C upstream apply ../Interaction04.patch
      - run: git -C upstream apply ../Interaction05.patch
      - run: git -C upstream apply ../Interaction06.patch
      - run: git -C upstream apply ../Interaction07.patch
      - run: git -C upstream apply ../CampaignReplication.patch
      - run: git -C upstream apply ../CampaignIdentity.patch
      - run: git -C upstream apply ../CampaignTrade.patch
      - run: git -C upstream apply ../CampaignTradeAccess.patch
      - run: git -C upstream apply ../WorldLifecycle.patch
      - run: git -C upstream apply ../ConnectionLifecycle.patch
      - run: git -C upstream apply ../SaveLoadLifecycle.patch
      - run: git -C upstream apply ../InventoryEvidence.patch
      - run: git -C upstream apply ../TradeReturn.patch
      - run: git -C upstream apply ../NativeTrade.patch
      - run: git -C upstream apply ../TradeItemProperties.patch
      - run: git -C upstream apply ../HomeInstances.patch
      - run: git -C upstream apply ../HomeScope.patch
      - run: git -C upstream apply ../HomeSnapshot.patch
      - run: git -C upstream apply ../HomeProjection.patch
      - run: git -C upstream apply ../HomeCatalog.patch
      - run: git -C upstream apply ../HomeAccessMenu.patch
      - run: git -C upstream apply ../HomeInventoryLedger.patch
      - run: git -C upstream apply ../HomeContainerMenu.patch
      - run: git -C upstream apply ../HomeVisit.patch
      - run: git -C upstream apply ../HomeLocks.patch
      - run: git -C upstream apply ../HomeActorRouting.patch
      - run: git -C upstream apply ../HomeResidents.patch
      - run: git -C upstream apply ../HomeActorProtection.patch
      - run: git -C upstream apply ../HomeResidentProjection.patch
      - run: git -C upstream apply ../HomeLooseProperty.patch
      - run: git -C upstream apply ../HomeObjectChanges.patch
      - run: git -C upstream apply ../HomePlacement.patch
      - run: git -C upstream apply ../HomePlacementClient.patch
      - run: git -C upstream apply ../HomeOwnerRecovery.patch
      - run: git -C upstream apply ../HomeLegacyPlacement.patch
      - run: git -C upstream apply ../HomeResidentRecovery.patch
      - run: git -C upstream apply ../HomeResidentPresence.patch
      - run: git -C upstream apply ../HomeGuestDoors.patch
      - run: git -C upstream apply ../CampaignCheckpoint.patch
      - uses: actions/checkout@v4
        with:
          repository: tiltedphoques/TiltedConnect
          ref: e6f5759364a64462e717db1153781a7eae26a13e
          path: connect-upstream
          persist-credentials: false
      - run: git -C connect-upstream apply ../TiltedConnectLifecycle.patch
      - name: Run all independent source and model checks
        shell: bash
        run: |
          failed=0
          run_check() {
            echo "::group::$*"
            if "$@"; then
              echo "PASS: $*"
            else
              echo "::error::Failed: $*"
              failed=1
            fi
            echo "::endgroup::"
          }
          run_check python3 tests/check_connection_lifecycle.py connect-upstream upstream
          run_check python3 tests/check_world_epoch.py upstream
          run_check python3 tests/check_save_load_lifecycle.py upstream
          run_check python3 tests/check_inventory_evidence.py upstream
          run_check python3 tests/check_encounter_combat.py upstream
          run_check python3 tests/check_home_routes.py upstream
          run_check python3 tests/check_home_registry.py upstream
          run_check python3 tests/check_home_scope.py upstream
          run_check python3 tests/check_home_snapshot.py upstream
          run_check python3 tests/check_home_projection.py upstream
          run_check python3 tests/check_home_catalog.py upstream
          run_check python3 tests/check_home_inventory_ledger.py upstream
          run_check python3 tests/check_home_container_menu.py upstream
          run_check python3 tests/check_home_visit.py upstream
          run_check python3 tests/check_home_locks.py upstream
          run_check python3 tests/check_home_residents.py upstream
          run_check python3 tests/check_home_actor_protection.py upstream
          run_check python3 tests/check_home_resident_projection.py upstream
          run_check python3 tests/check_home_loose_property.py upstream
          run_check python3 tests/check_home_objects.py upstream
          run_check python3 tests/check_home_placement.py upstream
          run_check python3 tests/check_guest_packaging.py
          run_check python3 tests/check_home_instances_generation.py
          run_check python3 tests/check_home_navmesh.py
          run_check python3 tests/check_encounter_recovery.py upstream
          run_check python3 tests/check_trade.py upstream
          run_check python3 tests/check_native_trade.py upstream
          run_check python3 tests/check_actor_replay.py upstream
          run_check python3 tools/check_progress_consent.py upstream
          run_check python3 tools/check_party_travel.py upstream
          run_check python3 tools/check_interaction_owner.py upstream
          run_check python3 tools/check_follower_dialogue.py upstream
          run_check python3 tools/check_coop_interaction.py upstream
          run_check python3 tools/check_quest_journal.py upstream
          run_check python3 tests/check_campaign_journal.py upstream
          run_check python3 tests/check_campaign_replication.py upstream
          run_check python3 tests/check_campaign_identity.py upstream
          run_check python3 tests/check_campaign_checkpoint.py upstream
          run_check python3 tools/check_life_confirmation.py upstream
          run_check python3 tools/check_observer.py upstream
          run_check python3 tools/check_replica_and_input.py upstream
          run_check python3 tools/check_dialogue_draw.py upstream
          run_check python3 tools/check_remote_hit.py upstream
          run_check python3 check.py upstream
          run_check python3 check_state3.py upstream
          run_check python3 check_dialogue2.py upstream
          exit "$failed"

  build:
    needs: check
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
        working-directory: upstream
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tiltedphoques/TiltedEvolution
          ref: 13ff0b5a934bf3016c8c898d9a019aa04e5c1fb0
          submodules: recursive
          fetch-depth: 0
          path: upstream
          persist-credentials: false
      - name: Apply co-op and overlay changes
        run: |
          git apply ../CoopState.patch
          git apply ../PartyLeadership.patch
          git apply ../PartyConversationHud.patch
          git apply ../Dialogue02.patch
          git apply ../PartyTravelAndRecovery.patch
          git apply ../Interaction02.patch
          git apply ../Interaction03.patch
          git apply ../Interaction04.patch
          git apply ../Interaction05.patch
          git apply ../Interaction06.patch
          git apply ../Interaction07.patch
          git apply ../CampaignReplication.patch
          git apply ../CampaignIdentity.patch
          git apply ../CampaignTrade.patch
          git apply ../CampaignTradeAccess.patch
          git apply ../WorldLifecycle.patch
          git apply ../ConnectionLifecycle.patch
          git apply ../SaveLoadLifecycle.patch
          git apply ../InventoryEvidence.patch
          git apply ../TradeReturn.patch
          git apply ../NativeTrade.patch
          git apply ../TradeItemProperties.patch
          git apply ../HomeInstances.patch
          git apply ../HomeScope.patch
          git apply ../HomeSnapshot.patch
          git apply ../HomeProjection.patch
          git apply ../HomeCatalog.patch
          git apply ../HomeAccessMenu.patch
          git apply ../HomeInventoryLedger.patch
          git apply ../HomeContainerMenu.patch
          git apply ../HomeVisit.patch
          git apply ../HomeLocks.patch
          git apply ../HomeActorRouting.patch
          git apply ../HomeResidents.patch
          git apply ../HomeActorProtection.patch
          git apply ../HomeResidentProjection.patch
          git apply ../HomeLooseProperty.patch
          git apply ../HomeObjectChanges.patch
          git apply ../HomePlacement.patch
          git apply ../HomePlacementClient.patch
          git apply ../HomeOwnerRecovery.patch
          git apply ../HomeLegacyPlacement.patch
          git apply ../HomeResidentRecovery.patch
          git apply ../HomeResidentPresence.patch
          git apply ../HomeGuestDoors.patch
          git apply ../CampaignCheckpoint.patch
          git -C Libraries/TiltedConnect apply ../../../TiltedConnectLifecycle.patch
          git -C Libraries/TiltedUI apply ../../../OverlayProcess.patch
      - name: Cache compiled xmake packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake/packages
          key: str-deps-windows2022-x64-release-13ff0b5a-xmake310
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.0'
      - run: xmake config --plat=windows --arch=x64 --mode=release --skyrim_version=1.6.1170 --yes
      - run: xmake -y
      - run: xmake run TPTests
      - name: Prepare runtime
        run: |
          set -eu
          xmake install -o distrib
          cp -R distrib/bin/. build/windows/x64/release/
          build/windows/x64/release/SkyrimTogetherServer.exe --generate-config ../ci-STServer.ini
          test -s ../ci-STServer.ini
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: upstream/Code/skyrim_ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Build user interface
        working-directory: upstream/Code/skyrim_ui
        run: |
          pnpm install --frozen-lockfile
          pnpm deploy:production
      - name: Assemble complete MO2 mod
        run: |
          set -eu
          mkdir -p ../mo2/SkyrimTogetherReborn
          cp -R GameFiles/Skyrim/. ../mo2/
          python ../tools/build_trade_plugin.py ../mo2/SkyrimCoopTrade.esp
          test -s ../mo2/SkyrimCoopTrade.esp
          cp ../GPL-3.0.txt ../TiltedEvolution-LICENSE.txt ../mo2/
          cp -R build/windows/x64/release/. ../mo2/SkyrimTogetherReborn/
          cp -R Code/skyrim_ui/dist/UI ../mo2/SkyrimTogetherReborn/
          cd ../mo2/SkyrimTogetherReborn
          rm -f *.pdb *.lib *.exp *Tests.exe
          test -s SkyrimTogether.exe
          test -s STServer.dll
          test -s SkyrimTogetherServer.exe
          test -s TPProcess.exe
          test -s UI/index.html
          test -s ../SkyrimTogether.esp
          cp SkyrimTogether.exe SkyrimSE.exe
          cd ..
          7z a -tzip ../Skyrim-Coop-SE-1170-Interaction07-dev-MO2.zip .
          7z t ../Skyrim-Coop-SE-1170-Interaction07-dev-MO2.zip
      - if: ${{ false }} # Public binary distribution pending license audit.
        uses: actions/upload-artifact@v4
        with:
          name: Skyrim-Coop-SE-1170-Interaction07-dev-MO2
          path: Skyrim-Coop-SE-1170-Interaction07-dev-MO2.zip
          if-no-files-found: error

  packaged-ui:
    if: ${{ false }} # Requires approved public package artifact.
    needs: build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/dialogue-ui-test.yml
    with:
      run_id: ${{ format('{0}', github.run_id) }}
