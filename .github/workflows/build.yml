name: Skyrim SE 1.6.1170 co-op
on:
  push:
    paths:
      - "required/**"
      - "important/**"
      - "reusable/patches/**"
      - "reusable/tests/**"
      - "reusable/tools/**"
      - "obsolete/**"
      - .github/workflows/build.yml
      - GPL-3.0.txt
      - TiltedEvolution-LICENSE.txt
      - .github/workflows/dialogue-ui-test.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tiltedphoques/TiltedEvolution
          ref: 13ff0b5a934bf3016c8c898d9a019aa04e5c1fb0
          path: upstream
          persist-credentials: false
      - run: git -C upstream apply ../required/patches/CoopState.patch
      - run: git -C upstream apply ../required/patches/PartyLeadership.patch
      - run: git -C upstream apply ../required/patches/PartyConversationHud.patch
      - run: git -C upstream apply ../required/patches/Dialogue02.patch
      - run: git -C upstream apply ../important/patches/PartyTravelAndRecovery.patch
      - run: git -C upstream apply ../important/patches/Interaction02.patch
      - run: git -C upstream apply ../important/patches/Interaction03.patch
      - run: git -C upstream apply ../important/patches/Interaction04.patch
      - run: git -C upstream apply ../important/patches/Interaction05.patch
      - run: git -C upstream apply ../important/patches/Interaction06.patch
      - run: git -C upstream apply ../important/patches/Interaction07.patch
      - run: git -C upstream apply ../required/patches/CampaignReplication.patch
      - run: git -C upstream apply ../required/patches/CampaignIdentity.patch
      - run: git -C upstream apply ../required/patches/CampaignTrade.patch
      - run: git -C upstream apply ../important/patches/CampaignTradeAccess.patch
      - run: git -C upstream apply ../required/patches/WorldLifecycle.patch
      - run: git -C upstream apply ../required/patches/ConnectionLifecycle.patch
      - run: git -C upstream apply ../required/patches/SaveLoadLifecycle.patch
      - run: git -C upstream apply ../required/patches/InventoryEvidence.patch
      - run: git -C upstream apply ../important/patches/TradeReturn.patch
      - run: git -C upstream apply ../important/patches/NativeTrade.patch
      - run: git -C upstream apply ../important/patches/TradeItemProperties.patch
      - run: git -C upstream apply ../obsolete/patches/HomeInstances.patch
      - run: git -C upstream apply ../reusable/patches/HomeScope.patch
      - run: git -C upstream apply ../reusable/patches/HomeSnapshot.patch
      - run: git -C upstream apply ../obsolete/patches/HomeProjection.patch
      - run: git -C upstream apply ../reusable/patches/HomeCatalog.patch
      - run: git -C upstream apply ../obsolete/patches/HomeAccessMenu.patch
      - run: git -C upstream apply ../important/patches/HomeInventoryLedger.patch
      - run: git -C upstream apply ../important/patches/HomeContainerMenu.patch
      - run: git -C upstream apply ../obsolete/patches/HomeVisit.patch
      - run: git -C upstream apply ../important/patches/HomeLocks.patch
      - run: git -C upstream apply ../obsolete/patches/HomeActorRouting.patch
      - run: git -C upstream apply ../reusable/patches/HomeResidents.patch
      - run: git -C upstream apply ../reusable/patches/HomeActorProtection.patch
      - run: git -C upstream apply ../obsolete/patches/HomeResidentProjection.patch
      - run: git -C upstream apply ../important/patches/HomeLooseProperty.patch
      - run: git -C upstream apply ../important/patches/HomeObjectChanges.patch
      - run: git -C upstream apply ../important/patches/HomePlacement.patch
      - run: git -C upstream apply ../important/patches/HomePlacementClient.patch
      - run: git -C upstream apply ../obsolete/patches/HomeOwnerRecovery.patch
      - run: git -C upstream apply ../obsolete/patches/HomeLegacyPlacement.patch
      - run: git -C upstream apply ../obsolete/patches/HomeResidentRecovery.patch
      - run: git -C upstream apply ../obsolete/patches/HomeResidentPresence.patch
      - run: git -C upstream apply ../obsolete/patches/HomeGuestDoors.patch
      - run: git -C upstream apply ../required/patches/CampaignCheckpoint.patch
      - run: git -C upstream apply ../reusable/patches/HomeNativeState.patch
      - run: git -C upstream apply ../obsolete/patches/HomeOriginalOverlay.patch
      - run: git -C upstream apply ../obsolete/patches/HomeOriginalVisit.patch
      - run: git -C upstream apply ../obsolete/patches/HomeGuestSave.patch
      - run: git -C upstream apply ../obsolete/patches/HomeNativeLoose.patch
      - run: git -C upstream apply ../obsolete/patches/HomeNativeDoors.patch
      - run: git -C upstream apply ../reusable/patches/HomeNativeInteractions.patch
      - run: git -C upstream apply ../important/patches/HomeSeatLeases.patch
      - run: git -C upstream apply ../obsolete/patches/HomeNativeResidents.patch
      - run: git -C upstream apply ../obsolete/patches/HomeNativeResidentPresence.patch
      - run: git -C upstream apply ../obsolete/patches/HomeLinkedRooms.patch
      - run: git -C upstream apply ../obsolete/patches/HomeLinkedAccess.patch
      - run: git -C upstream apply ../obsolete/patches/HomeLinkedCheckpoint.patch
      - run: git -C upstream apply ../reusable/patches/HomeEstateContext.patch
      - run: git -C upstream apply ../obsolete/patches/HomeEstateRouting.patch
      - run: git -C upstream apply ../obsolete/patches/HomeEstatePermissions.patch
      - run: git -C upstream apply ../required/patches/HomeSpatialEpoch.patch
      - run: git -C upstream apply ../reusable/patches/HomeEstateConstruction.patch
      - run: git -C upstream apply ../important/patches/HomeSharedProperty.patch
      - uses: actions/checkout@v4
        with:
          repository: tiltedphoques/TiltedConnect
          ref: e6f5759364a64462e717db1153781a7eae26a13e
          path: connect-upstream
          persist-credentials: false
      - run: git -C connect-upstream apply ../required/patches/TiltedConnectLifecycle.patch
      - name: Run all independent source and model checks
        shell: bash
        run: |
          failed=0
          run_check() {
            echo "::group::$*"
            if "$@"; then
              echo "PASS: $*"
            else
              echo "::error::Failed: $*"
              failed=1
            fi
            echo "::endgroup::"
          }
          run_check python3 required/tests/check_connection_lifecycle.py connect-upstream upstream
          run_check python3 required/tests/check_world_epoch.py upstream
          run_check python3 required/tests/check_save_load_lifecycle.py upstream
          run_check python3 required/tests/check_inventory_evidence.py upstream
          run_check python3 required/tests/check_encounter_combat.py upstream
          run_check python3 obsolete/tests/check_home_routes.py upstream
          run_check python3 obsolete/tests/check_home_registry.py upstream
          run_check python3 reusable/tests/check_home_scope.py upstream
          run_check python3 required/tests/check_home_spatial_epoch.py upstream
          run_check python3 reusable/tests/check_home_snapshot.py upstream
          run_check python3 obsolete/tests/check_home_projection.py upstream
          run_check python3 reusable/tests/check_home_catalog.py upstream
          run_check python3 important/tests/check_home_inventory_ledger.py upstream
          run_check python3 important/tests/check_home_container_menu.py upstream
          run_check python3 obsolete/tests/check_home_visit.py upstream
          run_check python3 important/tests/check_home_locks.py upstream
          run_check python3 reusable/tests/check_home_residents.py upstream
          run_check python3 reusable/tests/check_home_actor_protection.py upstream
          run_check python3 obsolete/tests/check_home_resident_projection.py upstream
          run_check python3 important/tests/check_home_loose_property.py upstream
          run_check python3 important/tests/check_home_objects.py upstream
          run_check python3 important/tests/check_home_placement.py upstream
          run_check python3 obsolete/tests/check_guest_packaging.py
          run_check python3 obsolete/tests/check_home_instances_generation.py
          run_check python3 obsolete/tests/check_home_navmesh.py
          run_check python3 important/tests/check_encounter_recovery.py upstream
          run_check python3 important/tests/check_trade.py upstream
          run_check python3 important/tests/check_native_trade.py upstream
          run_check python3 required/tests/check_actor_replay.py upstream
          run_check python3 important/tests/check_progress_consent.py upstream
          run_check python3 important/tests/check_party_travel.py upstream
          run_check python3 important/tests/check_interaction_owner.py upstream
          run_check python3 important/tests/check_follower_dialogue.py upstream
          run_check python3 important/tests/check_coop_interaction.py upstream
          run_check python3 required/tests/check_quest_journal.py upstream
          run_check python3 required/tests/check_campaign_journal.py upstream
          run_check python3 required/tests/check_campaign_replication.py upstream
          run_check python3 required/tests/check_campaign_identity.py upstream
          run_check python3 required/tests/check_campaign_checkpoint.py upstream
          run_check python3 reusable/tests/check_home_native_state.py upstream
          run_check python3 obsolete/tests/check_home_original_overlay.py upstream
          run_check python3 obsolete/tests/check_home_original_visit.py upstream
          run_check python3 obsolete/tests/check_home_guest_save.py upstream
          run_check python3 reusable/tests/check_home_native_capabilities.py upstream
          run_check python3 important/tests/check_home_seat_leases.py upstream
          run_check python3 obsolete/tests/check_home_native_residents.py upstream
          run_check python3 obsolete/tests/check_home_linked_rooms.py upstream
          run_check python3 reusable/tests/check_estate_catalog.py
          run_check python3 important/tests/check_home_linked_access.py upstream
          run_check python3 required/tests/check_life_confirmation.py upstream
          run_check python3 important/tests/check_observer.py upstream
          run_check python3 required/tests/check_replica_and_input.py upstream
          run_check python3 important/tests/check_dialogue_draw.py upstream
          run_check python3 required/tests/check_remote_hit.py upstream
          run_check python3 required/tests/check.py upstream
          run_check python3 required/tests/check_state3.py upstream
          run_check python3 required/tests/check_dialogue2.py upstream
          exit "$failed"

  build:
    needs: check
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
        working-directory: upstream
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tiltedphoques/TiltedEvolution
          ref: 13ff0b5a934bf3016c8c898d9a019aa04e5c1fb0
          submodules: recursive
          fetch-depth: 0
          path: upstream
          persist-credentials: false
      - name: Apply co-op and overlay changes
        run: |
          git apply ../required/patches/CoopState.patch
          git apply ../required/patches/PartyLeadership.patch
          git apply ../required/patches/PartyConversationHud.patch
          git apply ../required/patches/Dialogue02.patch
          git apply ../important/patches/PartyTravelAndRecovery.patch
          git apply ../important/patches/Interaction02.patch
          git apply ../important/patches/Interaction03.patch
          git apply ../important/patches/Interaction04.patch
          git apply ../important/patches/Interaction05.patch
          git apply ../important/patches/Interaction06.patch
          git apply ../important/patches/Interaction07.patch
          git apply ../required/patches/CampaignReplication.patch
          git apply ../required/patches/CampaignIdentity.patch
          git apply ../required/patches/CampaignTrade.patch
          git apply ../important/patches/CampaignTradeAccess.patch
          git apply ../required/patches/WorldLifecycle.patch
          git apply ../required/patches/ConnectionLifecycle.patch
          git apply ../required/patches/SaveLoadLifecycle.patch
          git apply ../required/patches/InventoryEvidence.patch
          git apply ../important/patches/TradeReturn.patch
          git apply ../important/patches/NativeTrade.patch
          git apply ../important/patches/TradeItemProperties.patch
          git apply ../obsolete/patches/HomeInstances.patch
          git apply ../reusable/patches/HomeScope.patch
          git apply ../reusable/patches/HomeSnapshot.patch
          git apply ../obsolete/patches/HomeProjection.patch
          git apply ../reusable/patches/HomeCatalog.patch
          git apply ../obsolete/patches/HomeAccessMenu.patch
          git apply ../important/patches/HomeInventoryLedger.patch
          git apply ../important/patches/HomeContainerMenu.patch
          git apply ../obsolete/patches/HomeVisit.patch
          git apply ../important/patches/HomeLocks.patch
          git apply ../obsolete/patches/HomeActorRouting.patch
          git apply ../reusable/patches/HomeResidents.patch
          git apply ../reusable/patches/HomeActorProtection.patch
          git apply ../obsolete/patches/HomeResidentProjection.patch
          git apply ../important/patches/HomeLooseProperty.patch
          git apply ../important/patches/HomeObjectChanges.patch
          git apply ../important/patches/HomePlacement.patch
          git apply ../important/patches/HomePlacementClient.patch
          git apply ../obsolete/patches/HomeOwnerRecovery.patch
          git apply ../obsolete/patches/HomeLegacyPlacement.patch
          git apply ../obsolete/patches/HomeResidentRecovery.patch
          git apply ../obsolete/patches/HomeResidentPresence.patch
          git apply ../obsolete/patches/HomeGuestDoors.patch
          git apply ../required/patches/CampaignCheckpoint.patch
          git apply ../reusable/patches/HomeNativeState.patch
          git apply ../obsolete/patches/HomeOriginalOverlay.patch
          git apply ../obsolete/patches/HomeOriginalVisit.patch
          git apply ../obsolete/patches/HomeGuestSave.patch
          git apply ../obsolete/patches/HomeNativeLoose.patch
          git apply ../obsolete/patches/HomeNativeDoors.patch
          git apply ../reusable/patches/HomeNativeInteractions.patch
          git apply ../important/patches/HomeSeatLeases.patch
          git apply ../obsolete/patches/HomeNativeResidents.patch
          git apply ../obsolete/patches/HomeNativeResidentPresence.patch
          git apply ../obsolete/patches/HomeLinkedRooms.patch
          git apply ../obsolete/patches/HomeLinkedAccess.patch
          git apply ../obsolete/patches/HomeLinkedCheckpoint.patch
          git apply ../reusable/patches/HomeEstateContext.patch
          git apply ../obsolete/patches/HomeEstateRouting.patch
          git apply ../obsolete/patches/HomeEstatePermissions.patch
          git apply ../required/patches/HomeSpatialEpoch.patch
          git apply ../reusable/patches/HomeEstateConstruction.patch
          git apply ../important/patches/HomeSharedProperty.patch
          git -C Libraries/TiltedConnect apply ../../../required/patches/TiltedConnectLifecycle.patch
          git -C Libraries/TiltedUI apply ../../../required/patches/OverlayProcess.patch
      - name: Cache compiled xmake packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake/packages
          key: str-deps-windows2022-x64-release-13ff0b5a-xmake310
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.0'
      - run: xmake config --plat=windows --arch=x64 --mode=release --skyrim_version=1.6.1170 --yes
      - run: xmake -y
      - name: Run TPTests with case diagnostics
        timeout-minutes: 5
        run: xmake run TPTests -d yes -s
      - name: Prepare runtime
        run: |
          set -eu
          xmake install -o distrib
          cp -R distrib/bin/. build/windows/x64/release/
          build/windows/x64/release/SkyrimTogetherServer.exe --generate-config ../ci-STServer.ini
          test -s ../ci-STServer.ini
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: upstream/Code/skyrim_ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Build user interface
        working-directory: upstream/Code/skyrim_ui
        run: |
          pnpm install --frozen-lockfile
          pnpm deploy:production
      - name: Assemble complete MO2 mod
        run: |
          set -eu
          mkdir -p ../mo2/SkyrimTogetherReborn
          cp -R GameFiles/Skyrim/. ../mo2/
          python ../required/tools/build_trade_plugin.py ../mo2/SkyrimCoopTrade.esp
          test -s ../mo2/SkyrimCoopTrade.esp
          cp ../GPL-3.0.txt ../TiltedEvolution-LICENSE.txt ../mo2/
          cp -R build/windows/x64/release/. ../mo2/SkyrimTogetherReborn/
          cp -R Code/skyrim_ui/dist/UI ../mo2/SkyrimTogetherReborn/
          cd ../mo2/SkyrimTogetherReborn
          rm -f *.pdb *.lib *.exp *Tests.exe
          test -s SkyrimTogether.exe
          test -s STServer.dll
          test -s SkyrimTogetherServer.exe
          test -s TPProcess.exe
          test -s UI/index.html
          test -s ../SkyrimTogether.esp
          cp SkyrimTogether.exe SkyrimSE.exe
          cd ..
          7z a -tzip ../Skyrim-Coop-SE-1170-Interaction07-dev-MO2.zip .
          7z t ../Skyrim-Coop-SE-1170-Interaction07-dev-MO2.zip
      - if: ${{ false }} # Public binary distribution pending license audit.
        uses: actions/upload-artifact@v4
        with:
          name: Skyrim-Coop-SE-1170-Interaction07-dev-MO2
          path: Skyrim-Coop-SE-1170-Interaction07-dev-MO2.zip
          if-no-files-found: error

  packaged-ui:
    if: ${{ false }} # Requires approved public package artifact.
    needs: build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/dialogue-ui-test.yml
    with:
      run_id: ${{ format('{0}', github.run_id) }}
